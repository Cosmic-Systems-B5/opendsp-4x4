<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>openDSP-4x4 Bridge</title>
    <style>
        :root {
            --bg:        #14161a;
            --bg-alt:    #191c21;
            --panel:     #1e2228;
            --panel-2:   #23282f;
            --line:      #2b3138;
            --line-soft: #262b31;
            --text:      #d7d9dc;
            --text-dim:  #8a8f96;
            --text-faint:#5c6169;
            --accent:    #6f7d8c;
            --accent-fg: #cfd6de;
            --good:      #6b8f7a;
            --good-fg:   #a7c4b2;
            --warn:      #9c8a5a;
            --warn-fg:   #d0c19a;
            --err:       #9c5f5f;
            --err-fg:    #d6a8a8;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            max-width: 1400px;
            margin: 0 auto;
            padding: .75rem;
            font-feature-settings: "tnum" 1;
        }
        h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
        h2 {
            font-size: .72rem;
            margin: 1rem 0 .4rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
        }

        code, .mono { font-family: var(--mono); font-size: .82em; }
        code { background: var(--bg-alt); padding: .05rem .3rem; border-radius: 3px;
            color: var(--text); }

        .status-ok   { color: var(--good-fg); }
        .status-warn { color: var(--warn-fg); }
        .status-err  { color: var(--err-fg); }

        .server-id {
            display: inline-block;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: .05rem .45rem;
            border-radius: 3px;
            font-family: var(--mono);
            font-size: .74rem;
            letter-spacing: .04em;
        }

        .copy {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .1rem .45rem;
            border-radius: 3px;
            background: var(--bg-alt);
            border: 1px solid var(--line-soft);
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: .74rem;
            cursor: pointer;
            transition: color .12s, border-color .12s, background .12s;
            user-select: none;
        }
        .copy:hover { color: var(--text); border-color: var(--accent); }
        .copy:active { background: var(--panel); }
        .copy.copied { color: var(--good-fg); border-color: var(--good); }
        .copy .icon { opacity: .6; font-size: .8em; line-height: 1; }
        .copy:hover .icon { opacity: 1; }
        .copy.copied .icon { opacity: 1; }

        .bar {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
            padding: .5rem .75rem;
            background: var(--panel);
            border: 1px solid var(--line-soft);
            border-radius: 6px;
            margin-bottom: .5rem;
        }
        .bar .sep { flex: 1; }
        .hint { color: var(--text-faint); font-style: italic; font-size: .76rem; }

        button {
            padding: .28rem .65rem;
            font-size: .76rem;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            background: var(--panel-2);
            color: var(--text);
            transition: background .12s, border-color .12s, color .12s;
        }
        button:hover { background: var(--line-soft); border-color: var(--accent); }
        button:active { background: var(--panel); }
        button:disabled { opacity: .45; cursor: default; }

        button.good { background: transparent; color: var(--good-fg); border-color: var(--good); }
        button.good:hover { background: rgba(107,143,122,.1); }
        button.bad  { background: transparent; color: var(--err-fg);  border-color: var(--err); }
        button.bad:hover  { background: rgba(156,95,95,.1); }
        button.secondary { background: transparent; color: var(--text-dim); border-color: var(--line); }
        button.secondary:hover { color: var(--text); }

        .pill {
            display: inline-block;
            padding: 0 .38rem;
            border-radius: 3px;
            font-size: .62rem;
            line-height: 1.6;
            font-weight: 600;
            background: var(--panel-2);
            color: var(--text-dim);
            border: 1px solid var(--line);
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .pill.hid   { color: #8fa5c4; border-color: #3a4a5e; background: rgba(60,80,110,.15); }
        .pill.mock  { color: #a08cc4; border-color: #4a3f5e; background: rgba(90,70,120,.15); }
        .pill.sub   { color: var(--good-fg); border-color: var(--good); background: rgba(107,143,122,.1); }

        .device-grid {
            display: grid;
            gap: .5rem;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        }
        .device-card {
            background: var(--panel);
            border: 1px solid var(--line-soft);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: .78rem;
            transition: border-color .15s;
        }
        .device-card.subscribed { border-color: var(--accent); }
        .device-card > header {
            padding: .4rem .6rem;
            background: var(--panel-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: .4rem;
            font-weight: 600;
            border-bottom: 1px solid var(--line-soft);
        }
        .device-card > header .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .device-card .meta {
            display: grid;
            grid-template-columns: 1fr;
            gap: .1rem;
            padding: .35rem .6rem;
            color: var(--text-dim);
            font-size: .72rem;
        }
        .device-card .meta div {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .device-card .meta b {
            color: var(--text);
            font-weight: 500;
            font-family: var(--mono);
            font-size: .95em;
        }
        .device-card .body {
            padding: .45rem .6rem .55rem;
            border-top: 1px solid var(--line-soft);
        }
        .device-card .buttons {
            padding: .4rem .6rem;
            display: flex;
            gap: .35rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--line-soft);
        }

        .matrix {
            display: grid;
            grid-template-columns: 24px repeat(4, 1fr);
            gap: 2px;
            font-family: var(--mono);
            font-size: .62rem;
        }
        .matrix .cell {
            background: var(--bg-alt);
            padding: 2px 0;
            text-align: center;
            border-radius: 2px;
            min-height: 16px;
            color: var(--text-dim);
        }
        .matrix .hdr { color: var(--text-dim); font-weight: 600; letter-spacing: .04em; }
        .matrix .lbl { color: var(--text-faint); text-align: right; padding-right: 4px; }
        .matrix .on  { background: rgba(107,143,122,.22); color: var(--good-fg); font-weight: 700; }

        .chans {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            font-family: var(--mono);
            font-size: .62rem;
            margin-top: .4rem;
        }
        .chans .ch {
            background: var(--bg-alt);
            border-radius: 2px;
            padding: 1px 3px;
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
        }
        .chans .ch .v { color: var(--text); }
        .chans .ch.mute { color: var(--err-fg); }
        .chans .ch.mute .v { color: var(--err-fg); }

        .empty {
            color: var(--text-faint);
            font-style: italic;
            padding: .25rem 0;
            font-size: .76rem;
        }

        #msgs-scroll { max-height: 320px; overflow: auto; }
        .msg-entry {
            display: grid;
            grid-template-columns: auto auto auto 1fr;
            gap: .4rem;
            align-items: baseline;
            padding: .22rem .5rem;
            margin-bottom: 1px;
            background: var(--bg-alt);
            border-radius: 3px;
            font-size: .71rem;
            font-family: var(--mono);
            border-left: 2px solid transparent;
            cursor: pointer;
        }
        .msg-entry.inbound  { border-left-color: #3a5a4a; }
        .msg-entry.outbound { border-left-color: #3a4a5e; }
        .msg-entry .ts  { color: var(--text-faint); }
        .msg-entry .dev { color: var(--text-dim); max-width: 12ch;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-entry .dir { color: var(--text-faint); font-size: .62rem; text-transform: uppercase; }
        .msg-entry .summary {
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .msg-entry .summary.json { color: #a0b8d4; }
        .msg-entry .summary.hex  { color: #a0c4a8; }
        .msg-entry .summary.text { color: #c4b8a0; }
        .msg-entry .summary::before {
            content: attr(data-prefix);
            color: var(--text-faint);
            margin-right: .3rem;
        }
        /* FIX: expanded rows need to wrap instead of ellipsizing. */
        .msg-entry.expanded .summary {
            white-space: pre-wrap;
            word-break: break-all;
            overflow: visible;
            text-overflow: clip;
        }

        /* FIX: style for the connection-log rows that the original HTML
           rendered with class .log-entry / .http / .ws but never styled. */
        .log-entry {
            display: grid;
            grid-template-columns: auto 4rem 1fr;
            gap: .4rem;
            padding: .18rem .5rem;
            margin-bottom: 1px;
            background: var(--bg-alt);
            border-radius: 3px;
            font-size: .71rem;
            font-family: var(--mono);
        }
        .log-entry .ts { color: var(--text-faint); }
        .log-entry .m  { color: var(--text-dim); text-transform: uppercase; font-size: .62rem; }
        .log-entry .p  { color: var(--text); overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
        .log-entry.http .m { color: #8fa5c4; }
        .log-entry.ws   .m { color: #a08cc4; }
        #logs-scroll { max-height: 220px; overflow: auto; }
    </style>
</head>
<body>

<div class="bar">
    <h1>openDSP-4x4</h1>
    <span class="server-id" id="server-id">…</span>
    <span>Status: <span id="status">…</span></span>
    <span class="sep"></span>
    <span class="copy" id="ws-copy" title="Click to copy">
        <span class="icon">⧉</span>
        <span id="ws-url" class="mono">ws://…</span>
    </span>
</div>

<div class="bar">
    <span>Devices: <b id="dev-count">0</b>
       (<span id="hid-count">0</span> HID, <span id="mock-count">0</span> mock)</span>
    <span>Mock: <b id="mock-state">…</b></span>
    <span class="sep"></span>
    <button id="add-mock" class="good">+ Add mock</button>
    <button id="remove-all-mock" class="bad">− Remove all mock</button>
    <button id="toggle-mock" class="secondary">Toggle mock</button>
    <button id="sub-all" class="secondary">Sub all</button>
    <button id="unsub-all" class="secondary">Unsub all</button>
</div>

<div class="device-grid" id="device-grid">
    <div class="empty">No devices yet…</div>
</div>

<h2 style="display:flex;align-items:center;gap:.5rem;">
    Messages
    <button id="clear-msgs" class="secondary"
            style="font-size:.7rem;padding:.1rem .4rem;margin-left:auto;">clear</button>
</h2>
<div id="msgs-scroll"><div id="msgs"><div class="empty">—</div></div></div>

<h2 style="display:flex;align-items:center;gap:.5rem;">
    Connection logs
    <button id="clear-logs" class="secondary"
            style="font-size:.7rem;padding:.1rem .4rem;margin-left:auto;">clear</button>
</h2>
<div id="logs-scroll"><div id="logs"><div class="empty">—</div></div></div>

<script>
    (() => {
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

        let ws = null;
        const devices = new Map();
        const subscriptions = new Set();
        const settings = new Map();

        // ----------------------------------------------------------------
        // Server info / status
        // ----------------------------------------------------------------
        async function loadServerInfo() {
            try {
                const info = await (await fetch('/server-info')).json();
                $('server-id').textContent = info.serverId;
                // FIX: backend now reports actual bound host; if it is not
                // 127.0.0.1, connect from the browser via window.location
                // (the WS URL shown is what *other* clients should use).
                const host = info.host || location.hostname;
                $('ws-url').textContent = `ws://${host}:${info.port}`;
                $('mock-state').textContent = info.mockMode ? 'ON' : 'OFF';
            } catch (e) { console.error(e); }
        }

        async function loadStatus() {
            try {
                const s = await (await fetch('/status')).json();
                $('dev-count').textContent  = s.deviceCount;
                $('hid-count').textContent  = s.hidCount;
                $('mock-count').textContent = s.mockCount;
                const el = $('status');
                if (s.deviceCount === 0) el.innerHTML = '<span class="status-err">no devices</span>';
                else if (s.mockMode && s.hidCount === 0) el.innerHTML = '<span class="status-warn">mock only</span>';
                else el.innerHTML = `<span class="status-ok">${s.deviceCount} device(s)</span>`;
            } catch (e) { console.error(e); }
        }

        async function loadLogs() {
            try {
                const logs = await (await fetch('/logs/connections')).json();
                const el = $('logs');
                if (!logs.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
                el.innerHTML = logs.slice(0, 200).map(l => {
                    // FIX: connectionLogs entries use .type ('http_request'),
                    // .method, .path; there is no separate WS type in the
                    // current backend, so classify by presence of method.
                    const cls = l.type === 'http_request' ? 'http' : 'ws';
                    const method = l.method || l.type || '';
                    return `<div class="log-entry ${cls}">
                        <span class="ts">${esc((l.timestamp || '').slice(11, 23))}</span>
                        <span class="m">${esc(method)}</span>
                        <span class="p" title="${esc(l.path || '')}">${esc(l.path || '')}</span>
                    </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        // ----------------------------------------------------------------
        // Message log (HID / WS payloads)
        // ----------------------------------------------------------------
        const TRUNC = 120;

        // FIX: single definition (original had two; the second overwrote the
        // first and made loadMessages call renderMessages twice per tick).
        async function loadMessages() {
            try {
                const logs = await (await fetch('/logs/messages')).json();
                renderMessages(logs);
            } catch (e) { console.error(e); }
        }

        function renderMessages(logs) {
            const el = $('msgs');
            if (!logs.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
            el.innerHTML = logs.slice(0, 200).map(l => {
                const kind = l.summary?.kind ?? 'none';
                const full = l.summary?.text ?? '';
                const short = full.length > TRUNC ? full.slice(0, TRUNC) + '…' : full;
                const dev = l.publishedId ? l.publishedId.slice(-12) : (l.deviceId || '—');
                const prefix =
                    kind === 'json' ? 'JSON' :
                        kind === 'hex'  ? 'HEX'  :
                            kind === 'text' ? 'TXT'  : '';
                // FIX: put the full text on the element so the click handler
                // can expand it. The original referenced row.dataset.full
                // which was never written.
                return `
                    <div class="msg-entry ${esc(l.direction || '')}"
                         data-full="${esc(full)}">
                        <span class="ts">${esc((l.timestamp || '').slice(11, 23))}</span>
                        <span class="dev" title="${esc(l.publishedId || l.deviceId || '')}">${esc(dev)}</span>
                        <span class="dir">${esc(l.direction || '')}</span>
                        <span class="summary ${esc(kind)}"
                              data-prefix="${esc(prefix)}"
                              title="${esc(full)}">${esc(short)}</span>
                    </div>`;
            }).join('');
        }

        // FIX: one clear handler (was bound twice) and it now resets the
        // poll target so the next 2s tick doesn't immediately repopulate.
        let msgsClearedAt = 0;
        $('clear-msgs').onclick = () => {
            $('msgs').innerHTML = '<div class="empty">—</div>';
            msgsClearedAt = Date.now();
        };

        // FIX: expand/collapse reads from data-full on the row.
        $('msgs').addEventListener('click', (e) => {
            const row = e.target.closest('.msg-entry');
            if (!row) return;
            const summary = row.querySelector('.summary');
            if (!summary) return;
            const full = row.dataset.full || '';
            row.classList.toggle('expanded');
            if (row.classList.contains('expanded')) {
                summary.textContent = full;
            } else {
                summary.textContent = full.length > TRUNC ? full.slice(0, TRUNC) + '…' : full;
            }
        });

        // ----------------------------------------------------------------
        // Click-to-copy on the WS address
        // ----------------------------------------------------------------
        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try { await navigator.clipboard.writeText(text); return true; }
                catch { /* fall through */ }
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.top = '0';
                ta.style.left = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch { return false; }
        }

        function flashCopied(el, ok) {
            const icon = el.querySelector('.icon');
            const prev = icon.textContent;
            el.classList.add('copied');
            icon.textContent = ok ? '✓' : '✕';
            setTimeout(() => {
                el.classList.remove('copied');
                icon.textContent = prev;
            }, 1200);
        }

        $('ws-copy').addEventListener('click', async () => {
            const text = $('ws-url').textContent.trim();
            if (!text || text === 'ws://…') return;
            const ok = await copyText(text);
            flashCopied($('ws-copy'), ok);
        });

        // ----------------------------------------------------------------
        // WebSocket bridge
        // ----------------------------------------------------------------
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'action', action: 'list_devices' }));
                for (const id of subscriptions) {
                    ws.send(JSON.stringify({ type: 'action', action: 'subscribe', deviceId: id }));
                }
            };

            ws.onmessage = (e) => {
                let msg; try { msg = JSON.parse(e.data); } catch { return; }
                if (msg.type === 'devices') {
                    devices.clear();
                    for (const d of msg.devices) devices.set(d.id, d);
                    render();
                } else if (msg.type === 'subscribed') {
                    subscriptions.add(msg.deviceId);
                    if (typeof msg.subscriberCount === 'number') {
                        setSubscriberCount(msg.deviceId, msg.subscriberCount);
                    }
                    render();
                } else if (msg.type === 'unsubscribed') {
                    subscriptions.delete(msg.deviceId);
                    settings.delete(msg.deviceId);
                    if (typeof msg.subscriberCount === 'number') {
                        setSubscriberCount(msg.deviceId, msg.subscriberCount);
                    }
                    render();
                } else if (msg.type === 'device_gone') {
                    subscriptions.delete(msg.deviceId);
                    settings.delete(msg.deviceId);
                    devices.delete(msg.deviceId);
                    render();
                } else if (msg.type === 'settings_update') {
                    settings.set(msg.deviceId, { channels: msg.channels, routing: msg.routing });
                    render();
                } else if (msg.type === 'error') {
                    console.warn('bridge error:', msg.code, msg.message || '');
                }
            };

            ws.onclose = () => setTimeout(connect, 1500);
            ws.onerror = (e) => console.error('WS error:', e);
        }

        function setSubscriberCount(deviceId, n) {
            const d = devices.get(deviceId);
            if (!d) return;
            devices.set(deviceId, { ...d, subscriberCount: n });
        }

        // ----------------------------------------------------------------
        // Rendering
        // ----------------------------------------------------------------
        function render() {
            const grid = $('device-grid');
            if (devices.size === 0) {
                grid.innerHTML = '<div class="empty">No devices yet…</div>';
                return;
            }
            // FIX: preserve DOM order by sorting — Map iteration order is
            // insertion order, which fluctuates as SSE merges new devices.
            const ids = [...devices.keys()].sort((a, b) => {
                const A = devices.get(a), B = devices.get(b);
                // mocks after hids, then by slot/id
                if (A.kind !== B.kind) return A.kind === 'hid' ? -1 : 1;
                return String(a).localeCompare(String(b), undefined, { numeric: true });
            });
            grid.innerHTML = ids.map(buildCard).join('');
        }

        function buildCard(id) {
            const d = devices.get(id) || {};
            const subscribed = subscriptions.has(id);
            const st = settings.get(id);
            const isMock = d.kind === 'mock';

            const kindPill = `<span class="pill ${esc(d.kind)}">${esc(d.kind)}</span>`;
            const subPill = subscribed ? '<span class="pill sub">sub</span>' : '';

            let routing = '<div class="empty" style="font-size:.7rem">routing —</div>';
            if (st?.routing?.length) {
                let rows = '<div class="cell"></div>';
                for (let i = 0; i < 4; i++) rows += `<div class="cell hdr">In${i + 1}</div>`;
                for (let out = 0; out < st.routing.length; out++) {
                    rows += `<div class="cell lbl">O${out + 1}</div>`;
                    for (let bit = 0; bit < 4; bit++) {
                        const on = (st.routing[out] & (1 << bit)) !== 0;
                        rows += `<div class="cell ${on ? 'on' : ''}">${on ? 'X' : ''}</div>`;
                    }
                }
                routing = `<div class="matrix">${rows}</div>`;
            }

            let chans = '';
            if (st?.channels?.length) {
                chans = '<div class="chans">' + st.channels.slice(0, 8).map((ch, i) =>
                    `<div class="ch ${ch.mute ? 'mute' : ''}">
                        <span>${i + 1}</span>
                        <span class="v">${ch.gainDb?.toFixed?.(0) ?? (ch.gainDb ?? '-')}dB</span>
                    </div>`).join('') + '</div>';
            }

            return `
                <div class="device-card ${subscribed ? 'subscribed' : ''}" data-device-id="${esc(id)}">
                    <header>
                        <span class="name" title="${esc(d.product || id)}">${esc(d.product || id)}</span>
                        <span>${kindPill} ${subPill}</span>
                    </header>
                    <div class="meta">
                        <div>id <b>${esc(d.publishedId || '—')}</b></div>
                        <div>slot <b>${esc(id)}</b></div>
                        <div>subs <b>${d.subscriberCount ?? 0}</b></div>
                    </div>
                    <div class="body">
                        ${routing}
                        ${chans}
                    </div>
                    <div class="buttons">
                        ${subscribed
                ? `<button class="secondary" data-action="unsub" data-id="${esc(id)}">Unsub</button>`
                : `<button class="good"     data-action="sub"   data-id="${esc(id)}">Sub</button>`}
                        ${isMock
                ? `<button class="bad" style="margin-left:auto"
                                   data-action="remove" data-id="${esc(id)}"
                                   title="Remove this mock device">×</button>`
                : ''}
                    </div>
                </div>`;
        }

        // ----------------------------------------------------------------
        // Actions
        // ----------------------------------------------------------------
        $('device-grid').addEventListener('click', (e) => {
            const btn = e.target.closest('button'); if (!btn) return;
            const { action, id } = btn.dataset;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            if (action === 'sub') {
                return ws.send(JSON.stringify({ type: 'action', action: 'subscribe', deviceId: id }));
            }
            if (action === 'unsub') {
                // Optimistic UI: the server will confirm with 'unsubscribed'.
                subscriptions.delete(id);
                render();
                return ws.send(JSON.stringify({ type: 'action', action: 'unsubscribe', deviceId: id }));
            }
            if (action === 'remove') {
                fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remove: id }),
                }).then(loadStatus).catch(console.error);
                return;
            }
        });

        $('sub-all').onclick = () => ws?.readyState === WebSocket.OPEN &&
            ws.send(JSON.stringify({ type: 'action', action: 'subscribe_all' }));
        $('unsub-all').onclick = () => ws?.readyState === WebSocket.OPEN &&
            ws.send(JSON.stringify({ type: 'action', action: 'unsubscribe_all' }));

        $('add-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ add: true }),
                });
                if (res.ok) {
                    const data = await res.json();
                    console.log('Added', data.publishedId);
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        $('remove-all-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remove: true }),
                });
                if (res.ok) {
                    const { removedCount } = await res.json();
                    console.log(`Removed ${removedCount} mock device(s)`);
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        // FIX: track mock state locally instead of scraping text content,
        // which was fragile across concurrent updates.
        let mockOn = false;
        $('toggle-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: !mockOn }),
                });
                if (res.ok) {
                    mockOn = !mockOn;
                    $('mock-state').textContent = mockOn ? 'ON' : 'OFF';
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        $('clear-logs').onclick = () => {
            $('logs').innerHTML = '<div class="empty">—</div>';
            logsClearedAt = Date.now();
        };
        let logsClearedAt = 0;

        // ----------------------------------------------------------------
        // SSE: device list
        // ----------------------------------------------------------------
        const devEs = new EventSource('/devices/changes');
        devEs.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type !== 'devices_update') return;
                const liveIds = new Set(data.devices.map(d => d.id));
                for (const d of data.devices) {
                    devices.set(d.id, { ...(devices.get(d.id) || {}), ...d });
                }
                for (const id of devices.keys()) if (!liveIds.has(id)) devices.delete(id);
                render();
            } catch (err) { console.error(err); }
        };
        devEs.onerror = () => {
            // EventSource auto-reconnects; just note it.
            console.warn('devices SSE error (will retry)');
        };

        // ----------------------------------------------------------------
        // Boot
        // ----------------------------------------------------------------
        // FIX: seed mockOn from server-info once so the toggle button agrees
        // with reality after a page reload.
        (async () => {
            await loadServerInfo();
            mockOn = ($('mock-state').textContent === 'ON');
        })();

        loadStatus();
        loadLogs();
        loadMessages();
        connect();

        setInterval(loadStatus, 5000);
        setInterval(() => {
            // FIX: skip poll if the user just cleared; avoids the "clear
            // button doesn't work" flicker in the original.
            if (Date.now() - logsClearedAt > 8000) loadLogs();
        }, 5000);
        setInterval(() => {
            if (Date.now() - msgsClearedAt > 8000) loadMessages();
        }, 2000);
    })();
</script>
</body>
</html>
