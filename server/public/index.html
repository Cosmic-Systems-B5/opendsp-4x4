<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>openDSP-4x4 Bridge</title>
    <style>
        :root {
            --bg:        #14161a;
            --bg-alt:    #191c21;
            --panel:     #1e2228;
            --panel-2:   #23282f;
            --line:      #2b3138;
            --line-soft: #262b31;
            --text:      #d7d9dc;
            --text-dim:  #8a8f96;
            --text-faint:#5c6169;
            --accent:    #6f7d8c;
            --accent-fg: #cfd6de;
            --good:      #6b8f7a;
            --good-fg:   #a7c4b2;
            --warn:      #9c8a5a;
            --warn-fg:   #d0c19a;
            --err:       #9c5f5f;
            --err-fg:    #d6a8a8;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
            --eq-c0: #6f8fac;
            --eq-c1: #8fac6f;
            --eq-c2: #c49a6f;
            --eq-c3: #a06fbc;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
            max-width: 1400px;
            margin: 0 auto;
            padding: .75rem;
            font-feature-settings: "tnum" 1;
        }
        h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
        h2 {
            font-size: .72rem;
            margin: 1rem 0 .4rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
        }

        code, .mono { font-family: var(--mono); font-size: .82em; }
        code { background: var(--bg-alt); padding: .05rem .3rem; border-radius: 3px;
            color: var(--text); }

        .status-ok   { color: var(--good-fg); }
        .status-warn { color: var(--warn-fg); }
        .status-err  { color: var(--err-fg); }

        .server-id {
            display: inline-block;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--text);
            padding: .05rem .45rem;
            border-radius: 3px;
            font-family: var(--mono);
            font-size: .74rem;
            letter-spacing: .04em;
        }

        .copy {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .1rem .45rem;
            border-radius: 3px;
            background: var(--bg-alt);
            border: 1px solid var(--line-soft);
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: .74rem;
            cursor: pointer;
            transition: color .12s, border-color .12s, background .12s;
            user-select: none;
        }
        .copy:hover { color: var(--text); border-color: var(--accent); }
        .copy:active { background: var(--panel); }
        .copy.copied { color: var(--good-fg); border-color: var(--good); }
        .copy .icon { opacity: .6; font-size: .8em; line-height: 1; }
        .copy:hover .icon { opacity: 1; }
        .copy.copied .icon { opacity: 1; }

        .bar {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
            padding: .5rem .75rem;
            background: var(--panel);
            border: 1px solid var(--line-soft);
            border-radius: 6px;
            margin-bottom: .5rem;
        }
        .bar .sep { flex: 1; }
        .hint { color: var(--text-faint); font-style: italic; font-size: .76rem; }

        button {
            padding: .28rem .65rem;
            font-size: .76rem;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            background: var(--panel-2);
            color: var(--text);
            transition: background .12s, border-color .12s, color .12s;
        }
        button:hover { background: var(--line-soft); border-color: var(--accent); }
        button:active { background: var(--panel); }
        button:disabled { opacity: .45; cursor: default; }

        button.good { background: transparent; color: var(--good-fg); border-color: var(--good); }
        button.good:hover { background: rgba(107,143,122,.1); }
        button.bad  { background: transparent; color: var(--err-fg);  border-color: var(--err); }
        button.bad:hover  { background: rgba(156,95,95,.1); }
        button.secondary { background: transparent; color: var(--text-dim); border-color: var(--line); }
        button.secondary:hover { color: var(--text); }

        .pill {
            display: inline-block;
            padding: 0 .38rem;
            border-radius: 3px;
            font-size: .62rem;
            line-height: 1.6;
            font-weight: 600;
            background: var(--panel-2);
            color: var(--text-dim);
            border: 1px solid var(--line);
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .pill.hid   { color: #8fa5c4; border-color: #3a4a5e; background: rgba(60,80,110,.15); }
        .pill.mock  { color: #a08cc4; border-color: #4a3f5e; background: rgba(90,70,120,.15); }
        .pill.sub   { color: var(--good-fg); border-color: var(--good); background: rgba(107,143,122,.1); }

        .device-grid {
            display: grid;
            gap: .5rem;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        }
        .device-card {
            background: var(--panel);
            border: 1px solid var(--line-soft);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: .78rem;
            transition: border-color .15s;
        }
        .device-card.subscribed { border-color: var(--accent); }
        .device-card > header {
            padding: .4rem .6rem;
            background: var(--panel-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: .4rem;
            font-weight: 600;
            border-bottom: 1px solid var(--line-soft);
        }
        .device-card > header .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .device-card .meta {
            display: grid;
            grid-template-columns: 1fr;
            gap: .1rem;
            padding: .35rem .6rem;
            color: var(--text-dim);
            font-size: .72rem;
        }
        .device-card .meta div {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .device-card .meta b {
            color: var(--text);
            font-weight: 500;
            font-family: var(--mono);
            font-size: .95em;
        }
        .device-card .body {
            padding: .45rem .6rem .55rem;
            border-top: 1px solid var(--line-soft);
        }
        .device-card .buttons {
            padding: .4rem .6rem;
            display: flex;
            gap: .35rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--line-soft);
        }

        /* Compact routing matrix: 5px cells, no axis labels */
        .matrix {
            display: grid;
            grid-template-columns: repeat(4, 5px);
            grid-auto-rows: 5px;
            gap: 1px;
            margin: 0 0 .35rem 0;
            width: max-content;
        }
        .matrix .cell {
            width: 5px;
            height: 5px;
            background: var(--bg-alt);
            border-radius: 1px;
        }
        .matrix .on { background: var(--good); }

        /* Compact 4-column channel strip, with a state-toggle row below */
        .chans {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            font-family: var(--mono);
            font-size: .6rem;
            margin-bottom: .35rem;
        }
        .chans .ch {
            background: var(--bg-alt);
            border-radius: 2px;
            padding: 2px 3px;
            display: grid;
            grid-template-rows: auto auto auto auto;
            gap: 1px;
            color: var(--text-dim);
            line-height: 1.2;
        }
        .chans .ch .row1 { display: flex; justify-content: space-between; gap: 4px; }
        .chans .ch .v { color: var(--text); }
        .chans .ch.mute-on .v { color: var(--err-fg); }
        .chans .ch .delay { color: var(--text-dim); }
        .chans .ch .state-row {
            display: flex;
            gap: 2px;
            margin-top: 1px;
        }
        .chans .ch .state-btn {
            flex: 1;
            text-align: center;
            border-radius: 2px;
            padding: 0 2px;
            font-size: .55rem;
            font-weight: 700;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-faint);
            cursor: default;
            user-select: none;
            line-height: 1.4;
        }
        .chans .ch .state-btn.on {
            border-color: var(--good);
            color: var(--good-fg);
            background: rgba(107,143,122,.15);
        }
        .chans .ch .state-btn.mute-btn.on {
            border-color: var(--err);
            color: var(--err-fg);
            background: rgba(156,95,95,.15);
        }

        /* Four separate graphic EQ boxes under the level strip */
        .eqrow {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            margin-top: .35rem;
        }
        .eqbox {
            background: var(--bg-alt);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--line-soft);
        }
        .eqbox svg {
            display: block;
            width: 100%;
            height: 44px;
        }
        .eqbox .eqgrid {
            stroke: var(--line-soft);
            stroke-width: .5;
            shape-rendering: crispEdges;
        }
        .eqbox .eqmid {
            stroke: var(--line);
            stroke-width: .5;
            shape-rendering: crispEdges;
        }
        .eqbox .eqline {
            fill: none;
            stroke-width: 1.25;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .empty {
            color: var(--text-faint);
            font-style: italic;
            padding: .25rem 0;
            font-size: .76rem;
        }

        #msgs-scroll { max-height: 320px; overflow: auto; }
        .msg-entry {
            display: grid;
            grid-template-columns: auto auto auto 1fr;
            gap: .4rem;
            align-items: baseline;
            padding: .22rem .5rem;
            margin-bottom: 1px;
            background: var(--bg-alt);
            border-radius: 3px;
            font-size: .71rem;
            font-family: var(--mono);
            border-left: 2px solid transparent;
            cursor: pointer;
        }
        .msg-entry.inbound  { border-left-color: #3a5a4a; }
        .msg-entry.outbound { border-left-color: #3a4a5e; }
        .msg-entry .ts  { color: var(--text-faint); }
        .msg-entry .dev { color: var(--text-dim); max-width: 14ch;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-entry .dir { color: var(--text-faint); font-size: .62rem; text-transform: uppercase; }
        .msg-entry .summary {
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .msg-entry .summary.json { color: #a0b8d4; }
        .msg-entry .summary.hex  { color: #a0c4a8; }
        .msg-entry .summary.text { color: #c4b8a0; }
        .msg-entry .summary::before {
            content: attr(data-prefix);
            color: var(--text-faint);
            margin-right: .3rem;
        }
        .msg-entry.expanded .summary {
            white-space: pre-wrap;
            word-break: break-all;
            overflow: visible;
            text-overflow: clip;
        }
    </style>
</head>
<body>

<div class="bar">
    <h1>openDSP-4x4</h1>
    <span class="server-id" id="server-id">…</span>
    <span>Status: <span id="status">…</span></span>
    <span class="sep"></span>
    <span class="copy" id="ws-copy" title="Click to copy">
        <span class="icon">⧉</span>
        <span id="ws-url" class="mono">ws://…</span>
    </span>
</div>

<div class="bar">
    <span>Devices: <b id="dev-count">0</b>
       (<span id="hid-count">0</span> HID, <span id="mock-count">0</span> mock)</span>
    <span>Mock: <b id="mock-state">…</b></span>
    <span class="sep"></span>
    <button id="add-mock" class="good">+ Add mock</button>
    <button id="remove-all-mock" class="bad">− Remove all mock</button>
    <button id="toggle-mock" class="secondary">Toggle mock</button>
    <button id="sub-all" class="secondary">Sub all</button>
    <button id="unsub-all" class="secondary">Unsub all</button>
</div>

<div class="device-grid" id="device-grid">
    <div class="empty">No devices yet…</div>
</div>

<h2 style="display:flex;align-items:center;gap:.5rem;">
    Messages
    <button id="clear-msgs" class="secondary"
            style="font-size:.7rem;padding:.1rem .4rem;margin-left:auto;">clear</button>
</h2>
<div id="msgs-scroll"><div id="msgs"><div class="empty">—</div></div></div>

<script>
    (() => {
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

        let ws = null;
        const devices = new Map();
        const subscriptions = new Set();
        const settings = new Map();

        // ----------------------------------------------------------------
        // Server info / status
        // ----------------------------------------------------------------
        async function loadServerInfo() {
            try {
                const info = await (await fetch('/server-info')).json();
                $('server-id').textContent = info.serverId;
                const host = info.host || location.hostname;
                $('ws-url').textContent = `ws://${host}:${info.port}`;
                $('mock-state').textContent = info.mockMode ? 'ON' : 'OFF';
            } catch (e) { console.error(e); }
        }

        async function loadStatus() {
            try {
                const s = await (await fetch('/status')).json();
                $('dev-count').textContent  = s.deviceCount;
                $('hid-count').textContent  = s.hidCount;
                $('mock-count').textContent = s.mockCount;
                const el = $('status');
                if (s.deviceCount === 0) el.innerHTML = '<span class="status-err">no devices</span>';
                else if (s.mockMode && s.hidCount === 0) el.innerHTML = '<span class="status-warn">mock only</span>';
                else el.innerHTML = `<span class="status-ok">${s.deviceCount} device(s)</span>`;
            } catch (e) { console.error(e); }
        }

        // ----------------------------------------------------------------
        // Message log
        // ----------------------------------------------------------------
        const TRUNC = 120;

        async function loadMessages() {
            try {
                const logs = await (await fetch('/logs/messages')).json();
                renderMessages(logs);
            } catch (e) { console.error(e); }
        }

        function renderMessages(logs) {
            const el = $('msgs');
            if (!logs.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
            el.innerHTML = logs.slice(0, 200).map(l => {
                const kind = l.summary?.kind ?? 'none';
                const full = l.summary?.text ?? '';
                const short = full.length > TRUNC ? full.slice(0, TRUNC) + '…' : full;
                const label = l.guid ?? l.serverid ?? '—';
                const prefix =
                    kind === 'json' ? 'JSON' :
                        kind === 'hex'  ? 'HEX'  :
                            kind === 'text' ? 'TXT'  : '';
                return `
                    <div class="msg-entry ${esc(l.direction || '')}"
                         data-full="${esc(full)}">
                        <span class="ts">${esc((l.timestamp || '').slice(11, 23))}</span>
                        <span class="dev" title="${esc(label)}">${esc(label)}</span>
                        <span class="dir">${esc(l.direction || '')}</span>
                        <span class="summary ${esc(kind)}"
                              data-prefix="${esc(prefix)}"
                              title="${esc(full)}">${esc(short)}</span>
                    </div>`;
            }).join('');
        }

        let msgsClearedAt = 0;
        $('clear-msgs').onclick = () => {
            $('msgs').innerHTML = '<div class="empty">—</div>';
            msgsClearedAt = Date.now();
        };

        $('msgs').addEventListener('click', (e) => {
            const row = e.target.closest('.msg-entry');
            if (!row) return;
            const summary = row.querySelector('.summary');
            if (!summary) return;
            const full = row.dataset.full || '';
            row.classList.toggle('expanded');
            summary.textContent = row.classList.contains('expanded')
                ? full
                : (full.length > TRUNC ? full.slice(0, TRUNC) + '…' : full);
        });

        // ----------------------------------------------------------------
        // Click-to-copy
        // ----------------------------------------------------------------
        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try { await navigator.clipboard.writeText(text); return true; }
                catch { /* fall through */ }
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.top = '0';
                ta.style.left = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch { return false; }
        }
        function flashCopied(el, ok) {
            const icon = el.querySelector('.icon');
            const prev = icon.textContent;
            el.classList.add('copied');
            icon.textContent = ok ? '✓' : '✕';
            setTimeout(() => {
                el.classList.remove('copied');
                icon.textContent = prev;
            }, 1200);
        }
        $('ws-copy').addEventListener('click', async () => {
            const text = $('ws-url').textContent.trim();
            if (!text || text === 'ws://…') return;
            flashCopied($('ws-copy'), await copyText(text));
        });

        // ----------------------------------------------------------------
        // WebSocket bridge
        // ----------------------------------------------------------------
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'action', action: 'list_devices' }));
                for (const guid of subscriptions) {
                    ws.send(JSON.stringify({ type: 'action', action: 'subscribe', guid }));
                }
            };

            ws.onmessage = (e) => {
                let msg; try { msg = JSON.parse(e.data); } catch { return; }
                const guid = msg.guid ?? null;
                switch (msg.type) {
                    case 'devices': {
                        devices.clear();
                        for (const d of msg.devices) devices.set(d.guid, d);
                        render();
                        return;
                    }
                    case 'subscribed': {
                        if (!guid) return;
                        subscriptions.add(guid);
                        if (typeof msg.subscriberCount === 'number') {
                            setSubscriberCount(guid, msg.subscriberCount);
                        }
                        if (!devices.has(guid)) {
                            devices.set(guid, {
                                guid,
                                serverid: msg.serverid,
                                product: msg.product,
                                kind: msg.kind,
                                subscriberCount: msg.subscriberCount ?? 1,
                            });
                        }
                        render();
                        return;
                    }
                    case 'unsubscribed': {
                        if (!guid) return;
                        subscriptions.delete(guid);
                        settings.delete(guid);
                        if (typeof msg.subscriberCount === 'number') {
                            setSubscriberCount(guid, msg.subscriberCount);
                        }
                        render();
                        return;
                    }
                    case 'device_gone': {
                        if (!guid) return;
                        subscriptions.delete(guid);
                        settings.delete(guid);
                        devices.delete(guid);
                        render();
                        return;
                    }
                    case 'settings_update': {
                        if (!guid) return;
                        settings.set(guid, { channels: msg.channels, routing: msg.routing });
                        render();
                        return;
                    }
                    case 'error': {
                        console.warn('bridge error:', msg.code, msg.message || '');
                        return;
                    }
                }
            };

            ws.onclose = () => setTimeout(connect, 1500);
            ws.onerror = (e) => console.error('WS error:', e);
        }

        function setSubscriberCount(guid, n) {
            const d = devices.get(guid);
            if (!d) return;
            devices.set(guid, { ...d, subscriberCount: n });
        }

        // ----------------------------------------------------------------
        // Single-output graphic EQ (one per output box)
        // ----------------------------------------------------------------
        const EQ_FMIN = 20, EQ_FMAX = 20000;
        const EQ_FREQS = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
        const EQ_SAMPLES = 48;
        const EQ_H = 44;
        const EQ_W = 64;
        const EQ_PAD = 2;

        function peqContributionDb(band, f) {
            if (!band || band.bypass) return 0;
            const f0 = Math.max(1, band.freqHz || 1000);
            const q = Math.max(0.1, band.q || 1);
            const x = Math.log2(f / f0);
            return (band.gainDb || 0) * Math.exp(-(x * x) * 2 * q * q);
        }

        function crossoverDb(ch, f) {
            const eq = ch?.eq;
            if (!eq) return 0;
            let db = 0;
            if (eq.lpf && eq.lpf.freqHz) {
                const fc = Math.max(20, eq.lpf.freqHz);
                if (f > fc) db -= 12 * Math.log2(f / fc);
            }
            if (eq.hpf && eq.hpf.freqHz) {
                const fc = Math.max(20, eq.hpf.freqHz);
                if (f < fc) db -= 12 * Math.log2(fc / f);
            }
            return db;
        }

        function totalGainDb(ch, f) {
            let db = 0;
            const bands = ch?.eq?.bands;
            if (Array.isArray(bands)) for (const b of bands) db += peqContributionDb(b, f);
            db += crossoverDb(ch, f);
            return db;
        }

        function freqToX(f, w) {
            const t = (Math.log2(f) - Math.log2(EQ_FMIN)) / (Math.log2(EQ_FMAX) - Math.log2(EQ_FMIN));
            return EQ_PAD + t * (w - 2 * EQ_PAD);
        }

        function dbToY(db, h) {
            const t = (12 - db) / 24;
            return EQ_PAD + t * (h - 2 * EQ_PAD);
        }

        function buildSingleEqSvg(channel, color) {
            const w = EQ_W, h = EQ_H;

            let grid = '';
            for (const f of EQ_FREQS) {
                const x = freqToX(f, w);
                grid += `<line class="eqgrid" x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${h}"/>`;
            }
            for (const db of [-6, 6]) {
                const y = dbToY(db, h);
                grid += `<line class="eqgrid" x1="0" y1="${y.toFixed(2)}" x2="${w}" y2="${y.toFixed(2)}"/>`;
            }
            const y0 = dbToY(0, h);
            grid += `<line class="eqmid" x1="0" y1="${y0.toFixed(2)}" x2="${w}" y2="${y0.toFixed(2)}"/>`;

            const pts = [];
            for (let i = 0; i < EQ_SAMPLES; i++) {
                const t = i / (EQ_SAMPLES - 1);
                const f = Math.pow(2, Math.log2(EQ_FMIN) + t * (Math.log2(EQ_FMAX) - Math.log2(EQ_FMIN)));
                const db = Math.max(-12, Math.min(12, totalGainDb(channel, f)));
                pts.push(`${freqToX(f, w).toFixed(2)},${dbToY(db, h).toFixed(2)}`);
            }

            return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                ${grid}
                <polyline class="eqline" points="${pts.join(' ')}" stroke="${color}"/>
            </svg>`;
        }

        // ----------------------------------------------------------------
        // Rendering
        // ----------------------------------------------------------------
        function render() {
            const grid = $('device-grid');
            if (devices.size === 0) {
                grid.innerHTML = '<div class="empty">No devices yet…</div>';
                return;
            }
            const guids = [...devices.keys()].sort((a, b) => {
                const A = devices.get(a), B = devices.get(b);
                if (A.kind !== B.kind) return A.kind === 'hid' ? -1 : 1;
                return String(a).localeCompare(String(b), undefined, { numeric: true });
            });
            grid.innerHTML = guids.map(buildCard).join('');
        }

        function buildCard(guid) {
            const d = devices.get(guid) || {};
            const subscribed = subscriptions.has(guid);
            const st = settings.get(guid);
            const isMock = d.kind === 'mock';

            const kindPill = `<span class="pill ${esc(d.kind)}">${esc(d.kind)}</span>`;
            const subPill = subscribed ? '<span class="pill sub">sub</span>' : '';

            // Compact routing matrix: 4x4 squares, 5px, no labels.
            let routing = '<div class="empty" style="font-size:.7rem">routing —</div>';
            if (st?.routing?.length) {
                let cells = '';
                for (let out = 0; out < st.routing.length; out++) {
                    for (let bit = 0; bit < 4; bit++) {
                        const on = (st.routing[out] & (1 << bit)) !== 0;
                        cells += `<div class="cell ${on ? 'on' : ''}"></div>`;
                    }
                }
                routing = `<div class="matrix" title="Routing matrix">${cells}</div>`;
            }

            // Compact per-channel strip: num/gain, delay, then mute + polarity
            // as their own toggle row. Toggle state reflects the actual values.
            let chans = '';
            if (st?.channels?.length) {
                chans = '<div class="chans">' + st.channels.slice(0, 8).map((ch, i) => {
                    const gain = (typeof ch.gainDb === 'number') ? `${ch.gainDb.toFixed(0)}dB` : '—';
                    const delay = (typeof ch.delayMs === 'number' && ch.delayMs > 0)
                        ? `${ch.delayMs.toFixed(1)}ms` : '';
                    const muteOn = !!ch.mute;
                    const polOn = !!ch.polarity;
                    return `<div class="ch ${muteOn ? 'mute-on' : ''}">
                        <div class="row1"><span>${i + 1}</span><span class="v">${gain}</span></div>
                        <div class="delay">${delay}</div>
                        <div class="state-row">
                            <span class="state-btn mute-btn ${muteOn ? 'on' : ''}" title="Mute">M</span>
                            <span class="state-btn pol-btn ${polOn ? 'on' : ''}" title="Polarity invert">Ø</span>
                        </div>
                    </div>`;
                }).join('') + '</div>';
            }

            // Four separate graphic EQ boxes under the level strip.
            let eqrow = '';
            if (st?.channels?.length >= 8) {
                const colors = ['var(--eq-c0)', 'var(--eq-c1)', 'var(--eq-c2)', 'var(--eq-c3)'];
                eqrow = '<div class="eqrow">';
                for (let i = 4; i < 8; i++) {
                    eqrow += `<div class="eqbox" title="Output ${i - 3} EQ">${buildSingleEqSvg(st.channels[i], colors[i - 4])}</div>`;
                }
                eqrow += '</div>';
            }

            return `
                <div class="device-card ${subscribed ? 'subscribed' : ''}" data-guid="${esc(guid)}">
                    <header>
                        <span class="name" title="${esc(d.product || guid)}">${esc(d.product || guid)}</span>
                        <span>${kindPill} ${subPill}</span>
                    </header>
                    <div class="meta">
                        <div>guid <b>${esc(d.guid || guid)}</b></div>
                        <div>serverid <b>${esc(d.serverid || '—')}</b></div>
                        <div>subs <b>${d.subscriberCount ?? 0}</b></div>
                    </div>
                    <div class="body">
                        ${routing}
                        ${chans}
                        ${eqrow}
                    </div>
                    <div class="buttons">
                        ${subscribed
                ? `<button class="secondary" data-action="unsub" data-guid="${esc(guid)}">Unsub</button>`
                : `<button class="good"     data-action="sub"   data-guid="${esc(guid)}">Sub</button>`}
                        ${isMock
                ? `<button class="bad" style="margin-left:auto"
                                   data-action="remove" data-guid="${esc(guid)}"
                                   title="Remove this mock device">×</button>`
                : ''}
                    </div>
                </div>`;
        }

        // ----------------------------------------------------------------
        // Actions
        // ----------------------------------------------------------------
        $('device-grid').addEventListener('click', (e) => {
            const btn = e.target.closest('button'); if (!btn) return;
            const { action, guid } = btn.dataset;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            if (action === 'sub') {
                return ws.send(JSON.stringify({ type: 'action', action: 'subscribe', guid }));
            }
            if (action === 'unsub') {
                subscriptions.delete(guid);
                render();
                return ws.send(JSON.stringify({ type: 'action', action: 'unsubscribe', guid }));
            }
            if (action === 'remove') {
                fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remove: guid }),
                }).then(loadStatus).catch(console.error);
                return;
            }
        });

        $('sub-all').onclick = () => ws?.readyState === WebSocket.OPEN &&
            ws.send(JSON.stringify({ type: 'action', action: 'subscribe_all' }));
        $('unsub-all').onclick = () => ws?.readyState === WebSocket.OPEN &&
            ws.send(JSON.stringify({ type: 'action', action: 'unsubscribe_all' }));

        $('add-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ add: true }),
                });
                if (res.ok) {
                    const data = await res.json();
                    console.log('Added', data.guid, data.serverid);
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        $('remove-all-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remove: true }),
                });
                if (res.ok) {
                    const { removedCount } = await res.json();
                    console.log(`Removed ${removedCount} mock device(s)`);
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        let mockOn = false;
        $('toggle-mock').onclick = async () => {
            try {
                const res = await fetch('/mock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enable: !mockOn }),
                });
                if (res.ok) {
                    mockOn = !mockOn;
                    $('mock-state').textContent = mockOn ? 'ON' : 'OFF';
                    loadStatus();
                }
            } catch (e) { console.error(e); }
        };

        // ----------------------------------------------------------------
        // SSE: device list
        // ----------------------------------------------------------------
        const devEs = new EventSource('/devices/changes');
        devEs.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type !== 'devices_update') return;
                const liveGuids = new Set(data.devices.map(d => d.guid));
                for (const d of data.devices) {
                    devices.set(d.guid, { ...(devices.get(d.guid) || {}), ...d });
                }
                for (const guid of [...devices.keys()]) {
                    if (!liveGuids.has(guid)) devices.delete(guid);
                }
                render();
            } catch (err) { console.error(err); }
        };
        devEs.onerror = () => console.warn('devices SSE error (will retry)');

        // ----------------------------------------------------------------
        // Boot
        // ----------------------------------------------------------------
        (async () => {
            await loadServerInfo();
            mockOn = ($('mock-state').textContent === 'ON');
        })();

        loadStatus();
        loadMessages();
        connect();

        setInterval(loadStatus, 5000);
        setInterval(() => {
            if (Date.now() - msgsClearedAt > 8000) loadMessages();
        }, 2000);
    })();
</script>
</body>
</html>
